# The publishing decision. pull_request_target runs the BASE branch's code
# with a write token — safe because the gate script never checks out or
# executes anything from the PR; it downloads the single submission file as
# data, validates it with the trusted validator, checks ownership, and
# merges when everything holds. PRs that do not qualify stay open for
# maintainer review with an explanatory comment.
name: automerge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch publish.yml after a merge (last step of the job).
  actions: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Base branch only — the PR's code is never checked out here.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The upload endpoint's GitHub App bot, e.g. "personal-jarvis-
          # marketplace[bot]". Empty until the App exists, which keeps the
          # trusted-branch path closed.
          TRUSTED_BOT_LOGIN: ${{ vars.TRUSTED_BOT_LOGIN }}
        run: python scripts/automerge_gate.py
      - name: Trigger publish after a merge
        # A merge performed with the Actions token does not cascade into
        # push-triggered workflows (GitHub's anti-recursion rule), so
        # without this step a merged submission never reaches index.json.
        # workflow_dispatch is the documented exception to that rule, and
        # publish.yml is idempotent, so a stray dispatch cannot hurt.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `merged` is not a gh field — the valid ones are state/mergedAt.
          merged=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
            --json state --jq '.state == "MERGED"')
          if [ "$merged" = "true" ]; then
            gh workflow run publish.yml --repo "${REPO}" --ref main
          fi
